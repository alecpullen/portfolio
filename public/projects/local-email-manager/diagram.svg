<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .bg { fill: #0c0e14; }
      .box { fill: rgba(6, 182, 212, 0.08); stroke: rgba(6, 182, 212, 0.45); stroke-width: 1.5; rx: 4; }
      .accent { fill: rgba(6, 182, 212, 0.15); stroke: rgba(6, 182, 212, 0.6); stroke-width: 1.5; rx: 4; }
      .text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; fill: #e2e8f0; text-anchor: middle; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #06b6d4; text-anchor: middle; letter-spacing: 0.04em; }
      .arrow { stroke: #06b6d4; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke: #06b6d4; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrowhead-dashed); }
      .title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 20px; font-weight: 600; fill: #f8fafc; text-anchor: middle; letter-spacing: 0.02em; }
      .subtitle { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06b6d4"/>
    </marker>
    <marker id="arrowhead-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06b6d4"/>
    </marker>
  </defs>

  <rect class="bg" width="800" height="500"/>

  <text x="400" y="44" class="title">Local Email Manager</text>
  <text x="400" y="68" class="subtitle">Self-hosted Go daemon · Gmail → LLM → Signal</text>

  <!-- Gmail API -->
  <rect class="box" x="80" y="120" width="130" height="56"/>
  <text x="145" y="153" class="text">Gmail API</text>

  <!-- Heuristics -->
  <rect class="box" x="280" y="120" width="130" height="56"/>
  <text x="345" y="153" class="text">Heuristics</text>

  <!-- Ollama LLM -->
  <rect class="accent" x="480" y="120" width="130" height="56"/>
  <text x="545" y="153" class="text">Ollama LLM</text>

  <!-- Classifier -->
  <rect class="box" x="280" y="240" width="130" height="56"/>
  <text x="345" y="273" class="text">Classifier</text>

  <!-- Signal -->
  <rect class="accent" x="80" y="360" width="130" height="56"/>
  <text x="145" y="393" class="text">Signal</text>

  <!-- SQLite -->
  <rect class="box" x="480" y="360" width="130" height="56"/>
  <text x="545" y="393" class="text">SQLite</text>

  <!-- Arrows -->
  <line class="arrow" x1="210" y1="148" x2="280" y2="148"/>
  <line class="arrow" x1="410" y1="148" x2="480" y2="148"/>
  <line class="arrow" x1="545" y1="176" x2="410" y2="240"/>
  <line class="arrow" x1="345" y1="240" x2="345" y2="176"/>
  <line class="arrow" x1="280" y1="268" x2="210" y2="360"/>
  <line class="arrow" x1="410" y1="268" x2="480" y2="360"/>

  <!-- Labels -->
  <text x="245" y="142" class="label">poll</text>
  <text x="445" y="142" class="label">triage</text>
  <text x="485" y="215" class="label">classify</text>
  <text x="240" y="310" class="label">alert</text>
  <text x="450" y="310" class="label">log metadata</text>

  <!-- Privacy note -->
  <text x="400" y="460" class="subtitle">Email bodies stay in memory · only metadata is stored</text>
</svg>